services:
  eclipse-audio-bot:
    build: .
    image: eclipse-audio-bot:latest
    container_name: eclipse-audio-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATA_DIR: /app/data
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - eclipse-audio-data:/app/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  eclipse-audio-data:
